onboarding = false
# herdr configuration — managed by nix: modules/shared/shells/herdr
# (symlinked to the live checkout; `herdr server reload-config` applies edits).

[keys]
# Match tmux muscle memory (see modules/shared/shells/tmux/config/tmux.conf)
prefix = "ctrl+s"

# prefix+r reloads config, like tmux `bind r source-file`.
# resize_mode defaults to prefix+r, so it moves to prefix+shift+r.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# vi-style pane navigation (herdr defaults, pinned to protect muscle memory)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# vi-style movement in the workspace picker (prefix+w), replacing up/down arrows
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# Match tmux's default '"' horizontal split binding.
# split_vertical stays default (prefix+v); only horizontal moves off prefix+minus.
split_horizontal = "prefix+double_quote"

# jj-workspace plugin (built and linked by nix — see ../default.nix).
# Actions are unbound in stock herdr; bindings from the plugin README.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "nathanflurry.jj-workspace.new-tab"
description = "new jj workspace (in tab)"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "nathanflurry.jj-workspace.new"
description = "new jj workspace"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "nathanflurry.jj-workspace.remove"
description = "remove jj workspace"

# Voice runs directly under Alacritty for macOS microphone permission, while
# retaining the invoking Herdr session. Shift+V leaves prefix+v (split) intact.
[[keys.command]]
key = "prefix+shift+v"
type = "shell"
command = '"$HOME/.local/bin/herdr-voice-local"'
description = "start local voice (Alacritty)"

# >>> herdr-projects key (added by the herdr-projects plugin; `herdr-projects remove-extras` removes it)
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "herdr-projects.open"
description = "work board"
# <<< herdr-projects key

[[keys.command]]
key = "prefix+ctrl+k"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[theme]
# Inherit the host terminal palette — Monokai Pro, defined once in
# modules/shared/desktop/terminals/alacritty/config/alacritty.toml.
name = "catppuccin"

auto_switch = false
[theme.custom]
accent = "#ffd866" # Monokai yellow

[ui]
agent_panel_sort = "spaces"
accent = "#ffd866"
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = true
pane_gaps = true

[ui.toast]
# In-app toasts when background agents finish or need attention.
delivery = "herdr"

[ui.sound]
enabled = true

# >>> herdr-projects sidebar (added by the herdr-projects plugin; `herdr-projects remove-extras` removes it)
[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", { token = "tab", rules = [{ equals = "Agent", hide = true }, { starts_with = "Reviewer #", hide = true }] }], ["agent"], [{ token = "$summary", dim = true }, "$progress"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], [{ token = "$summary", dim = true }, "$progress"]]
# <<< herdr-projects sidebar
